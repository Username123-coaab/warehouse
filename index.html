<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        /* 全局样式重置与基础设置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
        }
        a { text-decoration: none; color: inherit; }

        /* 头部区域 */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 60px 20px;
            text-align: center;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-bottom: 20px;
            object-fit: cover;
            background-color: #ddd; /* 占位背景色 */
        }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { font-size: 1.2rem; opacity: 0.9; }

        /* 内容容器 */
        .container {
            max-width: 900px;
            margin: -40px auto 40px;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* 卡片样式 */
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .card h2 {
            margin-bottom: 20px;
            color: #764ba2;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            display: inline-block;
        }
        .card p { margin-bottom: 15px; }

        /* 技能标签样式 */
        .skills { display: flex; flex-wrap: wrap; gap: 10px; }
        .skill-tag {
            background: #eef2ff;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .skill-tag:hover { background: #667eea; color: #fff; }

        /* 联系方式列表 */
        .contact-list { list-style: none; }
        .contact-list li { margin-bottom: 12px; display: flex; align-items: center; }
        .contact-list li::before {
            content: "📍"; /* 可以换成其他Emoji或图标 */
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- 头部信息 -->
    <header>
        <!-- 请替换为你自己的头像链接 -->
        <img src="https://via.placeholder.com/150" alt="个人头像" class="avatar">
        <h1>刘福林</h1>
        <p> 摄影爱好者 / 终身学习者</p>
    </header>

    <div class="container">
        <!-- 关于我 -->
        <section class="card">
            <h2>👋 关于我</h2>
            <p>你好！欢迎来到我的个人主页。我是一名充满热情的开发者，专注于构建用户友好的 Web 应用程序。</p>
            <p>在工作之余，我喜欢探索新技术、阅读科幻小说以及在城市中寻找有趣的咖啡馆。我相信代码不仅能解决问题，还能创造艺术。</p>
        </section>

        <!-- 技能展示 -->
        <section class="card">
            <h2>🛠 技能专长</h2>
            <div class="skills">
                <span class="skill-tag">HTML5 / CSS3</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Vue.js</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">UI/UX 设计</span>
                <span class="skill-tag">Git</span>
            </div>
        </section>

        <!-- 联系方式 -->
        <section class="card">
            <h2>📬 联系我</h2>
            <ul class="contact-list">
                <li>邮箱：liufulin_0807@qq.com</li>
                <li>GitHub：github.com/Username123-coaab</li>
                <li>微信：wxid_ud3h52sb4hj722</li>
            </ul>
        </section>
    </div>

</body>
</html>
